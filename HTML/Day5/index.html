<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5</title>
</head>

<body>

    <!-- Tables -->

    <center>
        <h1>Tables</h1>
    </center>

    <table border="2" cellpadding="10" cellspacing=10>

        <tr>
            <th>Name</th>
            <th>Address</th>
            <th>Email</th>
        </tr>

        <tr>
            <td>Saran</td>
            <td>Namakkal</td>
            <td>saran123@gmail.com</td>
        </tr>

        <tr>
            <td>Gokul</td>
            <td>Salem</td>
            <td>gokul123@gmail.com</td>
        </tr>

    </table>

    <!-- Tables with cellpadding and cellspacing -->

    <!-- thead -->
    <!-- tbody -->
    <!-- tfoot -->

    <table border="2" cellpadding="15" cellspacing="15">

        <thead>
            <tr>
                <th>Courses</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML</td>
                <td>1000</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>2000</td>
            </tr>
            <tr>
                <td>JavaScript</td>
                <td>2000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td>5000</td>
            </tr>
        </tfoot>

    </table>

    <!-- Table with RowSpan and ColSpan -->

    <table border="2">

        <tr>
            <th colspan="2">Row and Column Span</th>
        </tr>

        <tr>
            <td colspan="2">Data 1</td>

        </tr>

        <tr>
            <td>Data 2</td>
            <td rowspan="3">Rows</td>
        </tr>

        <tr>
            <td>Data 3</td>
        </tr>

    </table>


    <!-- Form Tag -->

    <form>

        <div>
            <input type="text" placeholder="Enter your Name">
        </div>

        <div>
            <input type="password" placeholder="Enter your Password">
        </div>

        <div>
            <input type="email" placeholder="Enter your Email">
        </div>

        <div>
            <input type="number" placeholder="Enter your Age">
        </div>

        <div>
            <input type="checkbox">
        </div>

        <div>
            <input type="radio">
        </div>

        <div>
            <textarea placeholder="Write your comments..."></textarea>
        </div>

        <div>
            <select>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
            </select>
        </div>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>

</html>
